name: Verify RDR alert overlays

on:
  push:
    branches: [qa/alert-boundaries-v8, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static alert checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<script src="alerts.js"></script>' index.html
          grep -q 'data-alerts="loading"' index.html
          grep -q 'alertArcQuery(0' alerts.js
          grep -q 'alertArcQuery(1' alerts.js
          grep -q 'function eAlertSummaryBox' alerts.js
          grep -q 'function eDrawWarnings' alerts.js
          node --check alerts.js
          node --check app.js
          node --check context.js

      - name: Install browser dependency
        shell: bash
        run: npm install --no-save --package-lock=false puppeteer-core >/dev/null

      - name: Exercise live source and deterministic alert rendering
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/rdr-alerts
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rdr-alerts-http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          cat > .verify-alerts.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          try{
            const live={};
            for(const id of ['home','metro','florida','regional']){
              const page=await browser.newPage();await page.setViewport({width:456,height:257,deviceScaleFactor:1});const errors=[];
              page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto(`http://127.0.0.1:8765/?view=${id}&verify=1&livealerts=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(id=>{const s=window.__RDR__,p=document.querySelector('#panel'),b=s?.boundaries?.get(id);return p?.dataset?.radar==='live'&&p?.dataset?.ready==='true'&&s?.frames?.length>=1&&(b?.states?.length||0)>=1}, {timeout:180000,polling:250}, id);
              await page.waitForFunction(()=>document.querySelector('#panel')?.dataset?.alerts!=='loading',{timeout:30000,polling:250});
              await page.evaluate(()=>render(performance.now()));
              const diag=await page.evaluate(()=>({feed:document.querySelector('#panel').dataset.alerts,alerts:eWarningsInView().map(x=>({code:x.meta.code,name:x.meta.name,sig:x.meta.sig})),ui:{...state.alertUi},errors:[...state.errors]}));diag.browserErrors=errors;live[id]=diag;
              await (await page.$('#panel')).screenshot({path:`/tmp/rdr-alerts/live-${id}.png`});
              if(errors.length)throw new Error(`browser ${id}: ${JSON.stringify(diag)}`);
              if(diag.feed==='unavailable')throw new Error(`live source ${id}: ${JSON.stringify(diag)}`);
              if(diag.alerts.length&&(diag.ui.boundaries!==diag.alerts.length||diag.ui.summary!==true))throw new Error(`live render contract ${id}: ${JSON.stringify(diag)}`);
              await page.close();
            }
            fs.writeFileSync('/tmp/rdr-alerts/live-alerts.json',JSON.stringify(live,null,2));

            const page=await browser.newPage();await page.setViewport({width:456,height:257,deviceScaleFactor:1});const errors=[];
            page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto(`http://127.0.0.1:8765/?view=home&verify=1&alerts=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{const s=window.__RDR__,p=document.querySelector('#panel'),b=s?.boundaries?.get('home');return p?.dataset?.radar==='live'&&p?.dataset?.ready==='true'&&s?.frames?.length>=1&&(b?.states?.length||0)>=1},{timeout:180000,polling:250});
            await page.waitForFunction(()=>document.querySelector('#panel')?.dataset?.alerts!=='loading',{timeout:30000,polling:250});
            const liveFeed=await page.evaluate(()=>document.querySelector('#panel').dataset.alerts);
            const diag=await page.evaluate(()=>{
              const box=(w,s,e,n)=>({type:'Polygon',coordinates:[[[w,s],[e,s],[e,n],[w,n],[w,s]]]});
              const future=new Date(Date.now()+45*60*1000).toISOString();
              const features=[
                {id:'qa-tor',type:'Feature',properties:{cap_id:'qa-tor',prod_type:'Tornado Warning',phenom:'TO',sig:'W',expiration:future},geometry:box(-80.245,26.015,-80.135,26.115)},
                {id:'qa-svr',type:'Feature',properties:{cap_id:'qa-svr',prod_type:'Severe Thunderstorm Warning',phenom:'SV',sig:'W',expiration:future},geometry:box(-80.405,26.145,-80.285,26.245)},
                {id:'qa-adv',type:'Feature',properties:{cap_id:'qa-adv',prod_type:'Heat Advisory',phenom:'HT',sig:'Y',expiration:future},geometry:box(-80.405,25.875,-80.285,25.965)}
              ];
              state.warnings.clear();for(const f of features)state.warnings.set(f.id,f);render(performance.now());
              const alerts=eWarningsInView().map(x=>({code:x.meta.code,name:x.meta.name,sig:x.meta.sig}));
              return{alerts,local:warningCode(localAlert()),ui:{...state.alertUi},geometry:[innerWidth,innerHeight,document.querySelector('#panel').getBoundingClientRect().width,document.querySelector('#panel').getBoundingClientRect().height]};
            });
            diag.liveFeed=liveFeed;diag.browserErrors=errors;fs.writeFileSync('/tmp/rdr-alerts/diagnostic.json',JSON.stringify(diag,null,2));
            await (await page.$('#panel')).screenshot({path:'/tmp/rdr-alerts/alert-overlays.png'});
            if(errors.length)throw new Error(JSON.stringify(diag));
            if(diag.geometry.some(x=>x!==456&&x!==257))throw new Error(`geometry: ${JSON.stringify(diag)}`);
            const codes=diag.alerts.map(x=>x.code);if(!codes.includes('TOR')||!codes.includes('SVR')||!codes.includes('ADV'))throw new Error(`codes: ${JSON.stringify(diag)}`);
            if(diag.local!=='TOR')throw new Error(`local priority: ${JSON.stringify(diag)}`);
            if(diag.ui.boundaries!==3||diag.ui.summary!==true||diag.ui.primary!=='TOR'||diag.ui.local!==true)throw new Error(`render contract: ${JSON.stringify(diag)}`);
            if(diag.ui.labels<2)throw new Error(`alert boxes missing: ${JSON.stringify(diag)}`);
            if(diag.liveFeed==='unavailable')throw new Error(`live alert source unavailable: ${JSON.stringify(diag)}`);
          } finally {await browser.close()}
          JS
          node .verify-alerts.mjs

      - name: Wait for deployed alert module
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            body=$(curl -fsSL "https://dmo18.github.io/rdr/?alerts=${GITHUB_SHA}-${i}" || true)
            if printf '%s' "$body" | grep -q '<script src="alerts.js"></script>'; then exit 0; fi
            sleep 5
          done
          echo 'Pages did not publish alerts.js' >&2
          exit 1

      - name: Exercise deployed alert rendering
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/rdr-alerts/deployed
          sed 's#http://127.0.0.1:8765/#https://dmo18.github.io/rdr/#g; s#/tmp/rdr-alerts/#/tmp/rdr-alerts/deployed/#g' .verify-alerts.mjs > .verify-alerts-deployed.mjs
          node .verify-alerts-deployed.mjs

      - name: Upload alert QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdr-alert-overlays
          path: /tmp/rdr-alerts
          if-no-files-found: warn
          retention-days: 7
