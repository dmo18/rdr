name: QA adaptive HiDPI RDR

on:
  push:
    branches: ['qa/hidpi-v9']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hidpi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static resolution checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-version="2026.08.12.9"' index.html
          grep -q 'data-resolution="adaptive-hidpi"' index.html
          grep -q '<script src="hidpi.js"></script>' index.html
          grep -q 'RDR_MAX_RENDER_SCALE' hidpi.js
          grep -q 'rdrPhysicalTarget' hidpi.js
          grep -q 'rdrLayerCanvas' hidpi.js
          grep -q 'rdrFilteredRadar' hidpi.js
          node --check hidpi.js
          node --check app.js
          node --check alerts.js

      - name: Install browser QA
        shell: bash
        run: |
          npm install --no-save --package-lock=false puppeteer-core >/dev/null
          python3 -m pip install --disable-pip-version-check pillow >/dev/null

      - name: Serve branch locally
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rdr-hidpi-http.log 2>&1 &
          sleep 1

      - name: Exercise adaptive backing resolution
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/rdr-hidpi
          cat > .qa-hidpi.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          const stats=a=>{a=[...a].sort((x,y)=>x-y);return{avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,p95:a.length?a[Math.min(a.length-1,Math.floor(a.length*.95))]:null,max:a.length?a.at(-1):null,count:a.length}};
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.setViewport({width:456,height:257,deviceScaleFactor:1});
            await page.goto(`http://127.0.0.1:8765/?view=home&verify=1&hidpi=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{const s=window.__RDR__,p=document.querySelector('#panel'),b=s?.boundaries?.get('home');return p?.dataset?.version==='2026.08.12.9'&&p?.dataset?.resolution&&p?.dataset?.radar==='live'&&p?.dataset?.ready==='true'&&s?.frames?.length>=1&&(b?.states?.length||0)>=1},{timeout:180000,polling:250});
            const scenarios=[
              ['yodeck',456,257,1],
              ['dpr2',456,257,2],
              ['double',912,514,1],
              ['hd',1600,900,1],
              ['fullhd',1920,1080,1],
              ['fourk-cap',3840,2160,1]
            ],out={};
            for(const [name,width,height,dpr] of scenarios){
              await page.setViewport({width,height,deviceScaleFactor:dpr});await new Promise(r=>setTimeout(r,700));
              await page.evaluate(()=>{window.__RDR__.perf.samples=[];render(performance.now())});await new Promise(r=>setTimeout(r,900));
              const d=await page.evaluate(()=>{const p=document.querySelector('#panel'),c=document.querySelector('#display'),r=p.getBoundingClientRect(),s=window.__RDR__;return{viewport:[innerWidth,innerHeight],panel:[r.width,r.height],backing:[c.width,c.height],dataset:{...p.dataset},render:s.render,samples:[...(s.perf?.samples||[])],errors:[...s.errors]}});d.paint=stats(d.samples);delete d.samples;out[name]=d;
              const target=d.panel[0]*dpr,ratio=d.backing[0]/target;
              if(name==='yodeck'&&(d.backing[0]!==456||d.backing[1]!==257))throw new Error(`Yodeck backing changed: ${JSON.stringify(d)}`);
              if(target>700&&d.backing[0]<=456)throw new Error(`scaled low-res bitmap: ${name} ${JSON.stringify(d)}`);
              if(target<=456*5.05&&(ratio<.92||ratio>1.12))throw new Error(`backing density mismatch: ${name} ratio=${ratio} ${JSON.stringify(d)}`);
              if(d.paint.p95!=null&&d.paint.p95>33)throw new Error(`warm paint: ${name} ${JSON.stringify(d.paint)}`);
              if(errors.length)throw new Error(`browser errors: ${JSON.stringify(errors)}`);
              if(name!=='fourk-cap')await page.screenshot({path:`/tmp/rdr-hidpi/${name}.png`,fullPage:true});
            }
            await page.setViewport({width:1600,height:900,deviceScaleFactor:1});await new Promise(r=>setTimeout(r,500));
            const alertDiag=await page.evaluate(()=>{
              const box=(w,s,e,n)=>({type:'Polygon',coordinates:[[[w,s],[e,s],[e,n],[w,n],[w,s]]]});
              state.warnings.clear();state.warnings.set('qa-tor',{id:'qa-tor',type:'Feature',properties:{cap_id:'qa-tor',prod_type:'Tornado Warning',phenom:'TO',sig:'W',expiration:new Date(Date.now()+3600000).toISOString()},geometry:box(-80.24,26.00,-80.13,26.13)});state.alertRevision=(state.alertRevision||0)+1;invalidateAlertCache();render(performance.now());
              return{backing:[canvas.width,canvas.height],render:state.render,alerts:eWarningsInView().map(x=>x.meta.code),ui:{...state.alertUi}};
            });
            if(!alertDiag.alerts.includes('TOR')||alertDiag.ui.boundaries<1||alertDiag.ui.summary!==true)throw new Error(`HiDPI alert overlay: ${JSON.stringify(alertDiag)}`);
            await page.screenshot({path:'/tmp/rdr-hidpi/alert-hd.png',fullPage:true});
            await page.evaluate(()=>showView(2));await new Promise(r=>setTimeout(r,1200));await page.screenshot({path:'/tmp/rdr-hidpi/florida-hd.png',fullPage:true});
            fs.writeFileSync('/tmp/rdr-hidpi/adaptive.json',JSON.stringify({scenarios:out,alertDiag,browserErrors:errors},null,2));
            await page.close();
          } finally {await browser.close()}
          JS
          node .qa-hidpi.mjs

      - name: Exercise full radar loop at HD size
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > .qa-hidpi-full.mjs <<'JS'
          import puppeteer from 'puppeteer-core';import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          const stats=a=>{a=[...a].sort((x,y)=>x-y);return{avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,p95:a.length?a[Math.min(a.length-1,Math.floor(a.length*.95))]:null,max:a.length?a.at(-1):null,count:a.length}};
          try{
            const page=await browser.newPage();await page.setViewport({width:1600,height:900,deviceScaleFactor:1});const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&/ReferenceError|SyntaxError|invalid GRIB|unsupported PNG|unsupported GRIB/i.test(m.text()))errors.push('console: '+m.text())});
            await page.goto(`http://127.0.0.1:8765/?view=florida&fullhidpi=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>{const s=window.__RDR__,p=document.querySelector('#panel'),b=s?.boundaries?.get('florida');return p?.dataset?.radar==='live'&&p?.dataset?.ready==='true'&&s?.frames?.length>=4&&s?.severe?.lightning&&s?.severe?.mesh&&(b?.states?.length||0)>=1},{timeout:240000,polling:500});
            await page.evaluate(()=>{window.__RDR__.perf.samples=[];eWarmCurrentView();render(performance.now())});await new Promise(r=>setTimeout(r,3200));
            const d=await page.evaluate(()=>{const p=document.querySelector('#panel'),c=document.querySelector('#display'),r=p.getBoundingClientRect(),s=window.__RDR__;return{frames:s.frames.length,severe:{lightning:!!s.severe.lightning,mesh:!!s.severe.mesh},backing:[c.width,c.height],panel:[r.width,r.height],render:s.render,samples:[...(s.perf?.samples||[])],errors:s.errors,dataset:{...p.dataset}}});d.paint=stats(d.samples);delete d.samples;d.browserErrors=errors;
            if(d.backing[0]<1500||d.backing[1]<850)throw new Error(`HD backing too small: ${JSON.stringify(d)}`);if(d.paint.p95!=null&&d.paint.p95>33)throw new Error(`HD full warm paint: ${JSON.stringify(d)}`);if(errors.length)throw new Error(JSON.stringify(d));
            await page.screenshot({path:'/tmp/rdr-hidpi/full-runtime-hd.png',fullPage:true});fs.writeFileSync('/tmp/rdr-hidpi/full-runtime-hd.json',JSON.stringify(d,null,2));await page.close();
          } finally {await browser.close()}
          JS
          node .qa-hidpi-full.mjs

      - name: Image quality checks
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          root=Path('/tmp/rdr-hidpi')
          expected={'yodeck':(456,257),'double':(912,514),'hd':(1600,900),'fullhd':(1920,1080),'alert-hd':(1600,900),'florida-hd':(1600,900),'full-runtime-hd':(1600,900)}
          for name,size in expected.items():
              p=root/f'{name}.png';im=Image.open(p).convert('RGB');assert im.size==size,(name,im.size,size)
              colors=len(im.resize((min(900,im.width),min(520,im.height))).getcolors(maxcolors=10000000) or [])
              assert colors>1000,(name,'too few colors',colors)
              # Edge energy catches accidental nearest-neighbor/blank rendering regressions.
              small=im.resize((456,257)).convert('L');px=list(small.getdata());w,h=small.size
              edge=sum(abs(px[y*w+x]-px[y*w+x-1]) for y in range(h) for x in range(1,w))
              assert edge>180000,(name,'too soft or blank',edge)
          PY

      - name: Upload HiDPI QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdr-hidpi-v9-qa
          path: /tmp/rdr-hidpi
          if-no-files-found: warn
          retention-days: 7
