name: Ingest NOAA weather data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/ingest.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: rdr-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoders
        run: pip install --disable-pip-version-check numpy pillow tifffile
      - name: Ingest and normalize NOAA data
        run: python scripts/ingest.py
      - name: Verify generated feed
        run: |
          test -s data/radar.json
          test -s data/context.json
          for view in home metro florida regional; do test -s "data/$view.png"; done
          grep -q 'MRMS' data/radar.json
      - name: Publish normalized feed
        run: |
          if git diff --quiet -- data/; then exit 0; fi
          git config user.name 'rdr-data-bot'
          git config user.email 'rdr-data-bot@users.noreply.github.com'
          git add data/
          git commit -m 'Update live NOAA data'
          git push
