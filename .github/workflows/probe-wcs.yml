name: Probe native live MRMS decoder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-wcs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run native browser decoder against newest MRMS
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/site
          cat > /tmp/site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body data-ready="false"><pre id=o>starting</pre><script>
          const sm16=n=>(n&0x8000)?-(n&0x7fff):(n&0x7fff),sm32=n=>(n&0x80000000)?-(n&0x7fffffff):(n&0x7fffffff);
          async function inflate(buf,kind){return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream(kind))).arrayBuffer()}
          function sections(ab){const d=new DataView(ab),u=new Uint8Array(ab),u32=o=>d.getUint32(o,false),u16=o=>d.getUint16(o,false);let o=16,s={};while(o<u.length-4){if(u[o]===55&&u[o+1]===55&&u[o+2]===55&&u[o+3]===55)break;const len=u32(o),n=d.getUint8(o+4);s[n]={o,len};o+=len}const a=s[1],g=s[3],r=s[5],z=s[7];if(!a||!g||!r||!z)throw Error('missing GRIB sections');const R=d.getFloat32(r.o+11,false),E=sm16(u16(r.o+15)),D=sm16(u16(r.o+17));return{d,u,R,E,D,bits:d.getUint8(r.o+19),nx:u32(g.o+30),ny:u32(g.o+34),la1:sm32(u32(g.o+46))/1e6,lo1:sm32(u32(g.o+50))/1e6,dx:u32(g.o+63)/1e6,dy:u32(g.o+67)/1e6,scan:d.getUint8(g.o+71),png:u.slice(z.o+5,z.o+z.len),ref:new Date(Date.UTC(d.getUint16(a.o+12,false),d.getUint8(a.o+14)-1,d.getUint8(a.o+15),d.getUint8(a.o+16),d.getUint8(a.o+17),d.getUint8(a.o+18)))}}
          const paeth=(a,b,c)=>{const p=a+b-c,pa=Math.abs(p-a),pb=Math.abs(p-b),pc=Math.abs(p-c);return pa<=pb&&pa<=pc?a:pb<=pc?b:c};
          async function decodePng16(png,meta){const d=new DataView(png.buffer,png.byteOffset,png.byteLength);let o=8,id=[];while(o<png.length){const n=d.getUint32(o,false),t=String.fromCharCode(...png.subarray(o+4,o+8));if(t==='IDAT')id.push(png.slice(o+8,o+8+n));o+=12+n;if(t==='IEND')break}const n=id.reduce((a,b)=>a+b.length,0),cat=new Uint8Array(n);let q=0;for(const x of id){cat.set(x,q);q+=x.length}const inf=new Uint8Array(await inflate(cat,'deflate')),stride=meta.nx*2,row=new Uint8Array(stride),prev=new Uint8Array(stride);let pos=0,lo=Infinity,hi=-Infinity,valid=0,home=null;const hx=Math.round(((360-80.18787062578414)-meta.lo1)/meta.dx),hy=Math.round((meta.la1-26.06197904865014)/meta.dy);for(let y=0;y<meta.ny;y++){const filter=inf[pos++];for(let i=0;i<stride;i++){const raw=inf[pos++],a=i>=2?row[i-2]:0,b=prev[i],c=i>=2?prev[i-2]:0;row[i]=(raw+(filter===0?0:filter===1?a:filter===2?b:filter===3?Math.floor((a+b)/2):filter===4?paeth(a,b,c):0))&255}for(let x=0;x<meta.nx;x+=17){const X=(row[x*2]<<8)|row[x*2+1],v=(meta.R+X*(2**meta.E))*(10**(-meta.D));if(v>-900){valid++;lo=Math.min(lo,v);hi=Math.max(hi,v)}}if(y===hy&&hx>=0&&hx<meta.nx){const X=(row[hx*2]<<8)|row[hx*2+1];home=(meta.R+X*(2**meta.E))*(10**(-meta.D))}prev.set(row)}return{lo,hi,valid,home,bytes:inf.length}}
          (async()=>{try{const day=new Date().toISOString().slice(0,10).replaceAll('-',''),prefix=`CONUS/MergedReflectivityQCComposite_00.50/${day}/`,lr=await fetch(`https://noaa-mrms-pds.s3.amazonaws.com/?list-type=2&prefix=${encodeURIComponent(prefix)}&max-keys=1000`,{cache:'no-store'}),xml=await lr.text(),keys=[...xml.matchAll(/<Key>([^<]+)<\/Key>/g)].map(m=>m[1]).filter(k=>k.endsWith('.grib2.gz')).sort(),key=keys.at(-1);if(!key)throw Error('no current key');const rr=await fetch('https://noaa-mrms-pds.s3.amazonaws.com/'+key,{cache:'no-store'}),grib=await inflate(await rr.arrayBuffer(),'gzip'),m=sections(grib);if(m.bits!==16||m.nx!==7000||m.ny!==3500)throw Error(`unexpected grid ${m.nx}x${m.ny} bits=${m.bits}`);const stats=await decodePng16(m.png,m);document.body.dataset.ready='true';document.body.dataset.valid=String(stats.valid);document.body.dataset.home=String(stats.home);document.getElementById('o').textContent=JSON.stringify({key,ref:m.ref.toISOString(),R:m.R,E:m.E,D:m.D,nx:m.nx,ny:m.ny,stats},null,2)}catch(e){document.body.dataset.error=String(e);document.getElementById('o').textContent=String(e)}})();
          </script>
          HTML
          cd /tmp/site; python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 & pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          timeout 150s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=120000 --dump-dom 'http://127.0.0.1:8765/' > /tmp/dom.html
          cat /tmp/dom.html
          grep -q 'data-ready="true"' /tmp/dom.html
          grep -Eq 'data-valid="[1-9][0-9]{3,}"' /tmp/dom.html

      - name: Confirm live severe-weather product prefixes
        shell: bash
        run: |
          set -euo pipefail
          day=$(date -u +%Y%m%d)
          for product in LightningProbabilityNext30minGrid MESH MergedAzShear0to2kmAGL; do
            url="https://noaa-mrms-pds.s3.amazonaws.com/?list-type=2&prefix=CONUS%2F${product}%2F${day}%2F&max-keys=5"
            echo "=== $product"
            curl -fsSL "$url" | grep -o '<Key>[^<]*</Key>' | tail -1 || true
          done
