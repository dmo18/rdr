name: Discover live MRMS product paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-wcs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List CONUS product prefixes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://noaa-mrms-pds.s3.amazonaws.com/?list-type=2&prefix=CONUS%2F&delimiter=%2F&max-keys=1000' -o /tmp/p.xml
          python - <<'PY'
          import re
          s=open('/tmp/p.xml').read()
          ps=re.findall(r'<CommonPrefixes><Prefix>([^<]+)</Prefix></CommonPrefixes>',s)
          for p in ps:
              if any(k.lower() in p.lower() for k in ['light','mesh','azshear','vil','echo','precip','reflect']): print(p)
          print('COUNT',len(ps))
          PY
