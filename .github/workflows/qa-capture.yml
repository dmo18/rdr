name: Capture RDR visual QA fixture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-capture.yml'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install capture dependency
        shell: bash
        run: npm install --no-save --package-lock=false puppeteer-core >/dev/null

      - name: Capture replayable live state
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/rdr-qa/source /tmp/rdr-qa/captures
          cat > .qa-capture.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          const payload={capturedAt:new Date().toISOString(),views:{},runtime:null};
          try{
            for(const id of ['home','metro','florida','regional']){
              const page=await browser.newPage();
              await page.setViewport({width:456,height:257,deviceScaleFactor:1});
              await page.goto(`https://dmo18.github.io/rdr/?view=${id}&qaCapture=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(id=>window.__RDR__?.frames?.length>=1&&(window.__RDR__?.surface?.get(id)?.length||0)>=1&&document.querySelector('#panel')?.dataset?.radar==='live',{timeout:180000,polling:500},id);
              payload.views[id]=await page.evaluate(id=>{
                const s=window.__RDR__;
                return {
                  boundaries:s.boundaries.get(id)||null,
                  surface:s.surface.get(id)||[],
                  weather:s.weather,
                  home:s.home,
                  motion:s.motion,
                  dataset:{...document.querySelector('#panel').dataset}
                };
              },id);
              await page.close();
            }
            const page=await browser.newPage();
            await page.setViewport({width:456,height:257,deviceScaleFactor:1});
            await page.goto(`https://dmo18.github.io/rdr/?view=florida&qaRuntime=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__RDR__?.frames?.length>=4&&window.__RDR__?.severe?.lightning&&window.__RDR__?.severe?.mesh,{timeout:240000,polling:500});
            payload.runtime=await page.evaluate(()=>{
              const s=window.__RDR__,cv=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[k,Array.from(v)]));
              return {
                frames:s.frames.map(f=>({key:f.key,time:new Date(f.time).toISOString(),views:cv(f.views)})),
                severe:{
                  lightning:s.severe.lightning?{key:s.severe.lightning.key,time:new Date(s.severe.lightning.time).toISOString(),views:cv(s.severe.lightning.views)}:null,
                  mesh:s.severe.mesh?{key:s.severe.mesh.key,time:new Date(s.severe.mesh.time).toISOString(),views:cv(s.severe.mesh.views)}:null
                },
                warnings:[...s.warnings.values()],
                tropics:s.tropics,
                weather:s.weather,
                home:s.home,
                motion:s.motion,
                errors:s.errors
              };
            });
            await page.screenshot({path:'/tmp/rdr-qa/captures/deployed-reference.png'});
            await page.close();
          } finally { await browser.close(); }
          fs.writeFileSync('/tmp/rdr-qa/fixture.json',JSON.stringify(payload));
          JS
          node .qa-capture.mjs
          rm -f .qa-capture.mjs
          cp index.html styles.css core.js radar.js context.js render.js broadcast.js app.js /tmp/rdr-qa/source/
          cp -R qa /tmp/rdr-qa/source/ 2>/dev/null || true
          du -h /tmp/rdr-qa/fixture.json

      - name: Upload QA fixture
        uses: actions/upload-artifact@v4
        with:
          name: rdr-local-qa-fixture
          path: /tmp/rdr-qa
          retention-days: 7
