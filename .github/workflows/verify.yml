name: Verify live MRMS RDR renderer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Static integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-version="2026.08.11.11"' index.html
          grep -q 'data-engine="live-mrms"' index.html
          grep -q 'noaa-mrms-pds.s3.amazonaws.com' core.js
          grep -q 'MergedReflectivityQCComposite_00.50' core.js
          grep -q 'template!==41' radar.js
          grep -q 'DecompressionStream' core.js
          ! grep -R 'data/home.png\|data/radar.json\|scripts/ingest.py' -- index.html app.js core.js radar.js context.js render.js README.md
          for f in app.js core.js radar.js context.js render.js; do node --check "$f"; done

      - name: Probe current NOAA MRMS object
        shell: bash
        run: |
          set -euo pipefail
          day=$(date -u +%Y%m%d)
          list="https://noaa-mrms-pds.s3.amazonaws.com/?list-type=2&prefix=CONUS%2FMergedReflectivityQCComposite_00.50%2F${day}%2F&max-keys=1000"
          curl -fsSL -H 'Origin: https://dmo18.github.io' "$list" -o /tmp/list.xml
          key=$(grep -o '<Key>[^<]*\.grib2\.gz</Key>' /tmp/list.xml | tail -1 | sed 's#</\?Key>##g')
          test -n "$key"
          curl -fsSI -H 'Origin: https://dmo18.github.io' "https://noaa-mrms-pds.s3.amazonaws.com/$key" | grep -qi 'access-control-allow-origin: \*'
          echo "$key"

      - name: Install image verification dependency
        run: python3 -m pip install --disable-pip-version-check pillow >/dev/null

      - name: Render every local scale at 456 x 257
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/renders/local
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          for v in home metro florida regional; do
            timeout 110s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=45000 --screenshot="/tmp/renders/local/$v.png" --dump-dom "http://127.0.0.1:8765/?view=$v&verify=1" > "/tmp/renders/local/$v.html" 2>/tmp/chrome-$v.log
            grep -q 'data-ready="true"' "/tmp/renders/local/$v.html"
            grep -q 'data-engine="live-mrms"' "/tmp/renders/local/$v.html"
          done
          python3 - <<'PY'
          from PIL import Image
          for v in ('home','metro','florida','regional'):
              im=Image.open(f'/tmp/renders/local/{v}.png').convert('RGB')
              assert im.size==(456,257), (v,im.size)
              px=list(im.getdata())
              assert len(set(px))>80, (v,'too few colors',len(set(px)))
              lit=sum(1 for r,g,b in px if max(r,g,b)>55)
              assert lit>2500, (v,'too dark',lit)
          PY

      - name: Wait for exact Pages version
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            body=$(curl -fsSL "https://dmo18.github.io/rdr/?verify=${GITHUB_SHA}-${i}" || true)
            if printf '%s' "$body" | grep -q 'data-version="2026.08.11.11"'; then exit 0; fi
            sleep 5
          done
          echo 'Pages did not publish the expected version' >&2
          exit 1

      - name: Render every deployed scale at 456 x 257
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/renders/live
          for v in home metro florida regional; do
            url="https://dmo18.github.io/rdr/?view=$v&verify=${GITHUB_SHA}"
            timeout 120s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=50000 --screenshot="/tmp/renders/live/$v.png" --dump-dom "$url" > "/tmp/renders/live/$v.html" 2>/tmp/live-$v.log
            grep -q 'data-ready="true"' "/tmp/renders/live/$v.html"
            grep -q 'data-engine="live-mrms"' "/tmp/renders/live/$v.html"
          done
          python3 - <<'PY'
          from PIL import Image
          for v in ('home','metro','florida','regional'):
              im=Image.open(f'/tmp/renders/live/{v}.png').convert('RGB')
              assert im.size==(456,257), (v,im.size)
              px=list(im.getdata())
              assert len(set(px))>80, (v,'too few colors',len(set(px)))
              lit=sum(1 for r,g,b in px if max(r,g,b)>55)
              assert lit>2500, (v,'too dark',lit)
          PY

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: rdr-live-mrms-renders
          path: /tmp/renders
          retention-days: 7
