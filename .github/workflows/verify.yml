name: Verify ingested-data RDR renderer

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'README.md'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static architecture
        run: |
          set -euo pipefail
          node --check app.js
          python -m py_compile scripts/ingest.py
          grep -q 'data-version="2026.08.11.10"' index.html
          grep -q 'data-engine="ingested-data"' index.html
          grep -q 'width="456" height="257"' index.html
          grep -q 'RIDGEII/L2' scripts/ingest.py
          grep -q 'tifffile' scripts/ingest.py
          grep -q 'watch_warn_adv/MapServer/0/query' scripts/ingest.py
          grep -q 'NHC_tropical_weather_summary' scripts/ingest.py
          ! grep -RniE 'GetMap|WMS|MapServer/export|cdn.star.nesdis.noaa.gov|basemaps.cartocdn.com|rainviewer' index.html styles.css app.js
      - name: Validate normalized feed files
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct,glob
          json.load(open('data/radar.json')); json.load(open('data/context.json'))
          fs=glob.glob('data/*.png'); assert len(fs)>=4
          for p in fs:
              with open(p,'rb') as f:
                  assert f.read(8)==b'\x89PNG\r\n\x1a\n'; f.read(4); assert f.read(4)==b'IHDR'; w,h=struct.unpack('>II',f.read(8)); assert (w,h)==(456,216),(p,w,h)
          PY
      - name: Render local views at exactly 456 x 257
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rdr-http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          mkdir -p screenshots/local screenshots/live
          for view in home metro florida regional; do
            url="http://127.0.0.1:8765/?view=$view"
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=8000 --dump-dom "$url" > "/tmp/$view.html"
            grep -q 'data-ready="true"' "/tmp/$view.html"
            grep -q 'data-feed="normalized-noaa"' "/tmp/$view.html"
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=8000 --screenshot="screenshots/local/$view.png" "$url"
          done
      - name: Wait for exact Pages version
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 42); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://dmo18.github.io/rdr/?verify=${GITHUB_SHA}-${attempt}" -o /tmp/live.html; then
              if grep -q 'data-version="2026.08.11.10"' /tmp/live.html; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
      - name: Render deployed views at exactly 456 x 257
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for view in home metro florida regional; do
            url="https://dmo18.github.io/rdr/?view=$view&verify=${GITHUB_SHA}"
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=8000 --dump-dom "$url" > "/tmp/live-$view.html"
            grep -q 'data-ready="true"' "/tmp/live-$view.html"
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=456,257 --virtual-time-budget=8000 --screenshot="screenshots/live/$view.png" "$url"
          done
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdr-ingested-data-renders
          path: screenshots/
          retention-days: 14
