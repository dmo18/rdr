name: Verify radar-only Yodeck panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Static integrity and radar-only policy
        shell: bash
        run: |
          set -euo pipefail
          node --check radar.js
          node --check sw.js
          grep -q 'width:456px;height:257px' radar.css
          grep -q 'radar.weather.gov/ridge/standard/KAMX_loop.gif' radar.js
          ! grep -RniE 'open-meteo|api\.weather\.gov|rainviewer|apikey|api_key|client_secret|access_token|unpkg\.com|jsdelivr\.net|cdnjs\.cloudflare\.com' index.html radar.css radar.js sw.js
          ! grep -Eqi '<script[^>]+src="https?://' index.html
          ! grep -Eqi '<link[^>]+href="https?://' index.html
          test "$(grep -o '<header' index.html | wc -l)" = 0
          echo 'radar-only static policy passed'

      - name: Probe direct NOAA radar images
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 \
            'https://radar.weather.gov/ridge/standard/KAMX_loop.gif' -o /tmp/kamx-loop.gif
          curl -fsSL --retry 4 --retry-delay 2 --max-time 30 \
            'https://radar.weather.gov/ridge/standard/KAMX_0.gif' -o /tmp/kamx-frame.gif
          python3 - <<'PY'
          from pathlib import Path
          for p in ['/tmp/kamx-loop.gif','/tmp/kamx-frame.gif']:
              b=Path(p).read_bytes()
              assert b[:6] in (b'GIF87a',b'GIF89a'), p
              assert len(b) > 10000, (p,len(b))
          print('direct NOAA KAMX images valid')
          PY

      - name: Render exact 456 x 257 panel locally
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rdr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          mkdir -p screenshots
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=456,257 --virtual-time-budget=9000 \
            --screenshot=screenshots/local-radar.png 'http://127.0.0.1:8765/'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=456,257 --virtual-time-budget=9000 --dump-dom \
            'http://127.0.0.1:8765/' > /tmp/local-dom.html
          grep -q '>LIVE<' /tmp/local-dom.html
          ! grep -q 'RADAR FEED UNAVAILABLE' /tmp/local-dom.html || ! grep -q 'source-failure hidden' /tmp/local-dom.html
          python3 - <<'PY'
          import struct
          p='screenshots/local-radar.png'
          with open(p,'rb') as f:
              assert f.read(8)==b'\x89PNG\r\n\x1a\n'
              f.read(8)
              width,height=struct.unpack('>II',f.read(8))
          assert (width,height)==(456,257),(width,height)
          print('local radar render is exactly 456x257')
          PY

      - name: Wait for this commit on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          target='https://dmo18.github.io/rdr/'
          ok=0
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${target}?verify=${GITHUB_SHA}-${attempt}" -o /tmp/live.html; then
              if grep -q '<title>RDR South Florida Radar</title>' /tmp/live.html && grep -q 'radar.css' /tmp/live.html && grep -q 'radar.js' /tmp/live.html; then
                ok=1; break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo 'public Pages HTML is current'

      - name: Render and verify deployed panel
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          live="https://dmo18.github.io/rdr/?verify=${GITHUB_SHA}"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=456,257 --virtual-time-budget=12000 --dump-dom "$live" > /tmp/live-dom.html
          grep -q '>LIVE<' /tmp/live-dom.html
          grep -q 'source-failure hidden' /tmp/live-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=456,257 --virtual-time-budget=12000 \
            --screenshot=screenshots/live-radar.png "$live"
          python3 - <<'PY'
          import struct
          for p in ['screenshots/local-radar.png','screenshots/live-radar.png']:
              with open(p,'rb') as f:
                  f.read(16); width,height=struct.unpack('>II',f.read(8))
              assert (width,height)==(456,257),(p,width,height)
          print('live radar panel passed at exact Yodeck dimensions')
          PY

      - name: Upload radar renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdr-yodeck-radar-renders
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
