name: Verify live MRMS RDR renderer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-version="2026.08.12.6"' index.html
          grep -q 'data-layout="broadcast-fullbleed"' index.html
          grep -q '<script src="broadcast.js"></script>' index.html
          grep -q 'top:0,bottom:0,mapHeight:257' core.js
          grep -q 'noaa-mrms-pds.s3.amazonaws.com' core.js
          grep -q 'MergedReflectivityQCComposite_00.50' core.js
          grep -q 'function broadcastRadarSurfaces' broadcast.js
          grep -q 'function broadcastCloudCanvas' broadcast.js
          grep -q 'function broadcastCellLabels' broadcast.js
          grep -q 'render=function' broadcast.js
          grep -q 'template!==41' radar.js
          grep -q 'meta.bits===24' radar.js
          ! grep -R 'data/home.png\|data/radar.json\|scripts/ingest.py' -- index.html app.js core.js radar.js context.js render.js broadcast.js README.md
          for f in app.js core.js radar.js context.js render.js broadcast.js; do node --check "$f"; done

      - name: Probe current NOAA data sources
        shell: bash
        run: |
          set -euo pipefail
          day=$(date -u +%Y%m%d)
          list="https://noaa-mrms-pds.s3.amazonaws.com/?list-type=2&prefix=CONUS%2FMergedReflectivityQCComposite_00.50%2F${day}%2F&max-keys=1000"
          curl -fsSL -H 'Origin: https://dmo18.github.io' "$list" -o /tmp/list.xml
          key=$(grep -o '<Key>[^<]*\.grib2\.gz</Key>' /tmp/list.xml | tail -1 | sed 's#</\?Key>##g')
          test -n "$key"
          curl -fsSI -H 'Origin: https://dmo18.github.io' "https://noaa-mrms-pds.s3.amazonaws.com/$key" | grep -qi 'access-control-allow-origin: \*'
          surface='https://mapservices.weather.noaa.gov/vector/rest/services/obs/surface_obs/MapServer/160/query?where=1%3D1&geometry=-80.46%2C25.84%2C-79.96%2C26.30&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects&outFields=stationname%2Ctimeobs%2Ccloudcover%2Cwinddir%2Cwindspeed&returnGeometry=true&f=geojson'
          curl -fsSL "$surface" -o /tmp/surface.json
          grep -q '"features"' /tmp/surface.json
          echo "$key"

      - name: Install visual verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false puppeteer-core >/dev/null
          python3 -m pip install --disable-pip-version-check pillow >/dev/null

      - name: Create exact viewport renderer
        shell: bash
        run: |
          cat > .verify-render.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const [base,out]=process.argv.slice(2),chrome=process.env.CHROME;
          if(!chrome) throw new Error('CHROME is not set');
          fs.mkdirSync(out,{recursive:true});
          const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          try{
            for(const v of ['home','metro','florida','regional']){
              const page=await browser.newPage();await page.setViewport({width:456,height:257,deviceScaleFactor:1});
              const browserErrors=[];page.on('pageerror',e=>browserErrors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')browserErrors.push('console: '+m.text())});
              const sep=base.includes('?')?'&':'?',url=`${base}${sep}view=${v}&verify=1&ci=${Date.now()}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(id=>{const p=document.querySelector('#panel'),s=window.__RDR__;return p?.dataset?.version==='2026.08.12.6'&&p?.dataset?.radar==='live'&&p?.dataset?.ready==='true'&&s?.frames?.length>=1&&(s?.surface?.get(id)?.length||0)>=1},{timeout:120000,polling:250},v);
              await new Promise(r=>setTimeout(r,1200));
              const diag=await page.evaluate(id=>{const p=document.querySelector('#panel'),s=window.__RDR__,latest=s.frames.at(-1)?.time;return{dataset:{...p.dataset},frames:s.frames.length,surface:s.surface.get(id)?.length||0,latestAgeMs:latest?Date.now()-new Date(latest).getTime():null,home:s.home,errors:s.errors,viewport:[innerWidth,innerHeight],panel:[p.getBoundingClientRect().width,p.getBoundingClientRect().height]}},v);
              if(diag.dataset.layout!=='broadcast-fullbleed'||diag.dataset.radar!=='live'||diag.frames<1||diag.surface<1)throw new Error(`${v} missing full bleed live layers: ${JSON.stringify(diag)}`);
              if(!(diag.latestAgeMs>=0&&diag.latestAgeMs<15*60*1000))throw new Error(`${v} radar stale: ${JSON.stringify(diag)}`);
              if(diag.viewport[0]!==456||diag.viewport[1]!==257||diag.panel[0]!==456||diag.panel[1]!==257)throw new Error(`${v} wrong geometry: ${JSON.stringify(diag)}`);
              const panel=await page.$('#panel');await panel.screenshot({path:`${out}/${v}.png`});fs.writeFileSync(`${out}/${v}.json`,JSON.stringify({...diag,browserErrors},null,2));await page.close();
            }
          }finally{await browser.close()}
          JS

      - name: Render local scales from live NOAA data
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/renders/local
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          node .verify-render.mjs 'http://127.0.0.1:8765/' /tmp/renders/local

      - name: Wait for exact Pages version
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            body=$(curl -fsSL "https://dmo18.github.io/rdr/?verify=${GITHUB_SHA}-${i}" || true)
            if printf '%s' "$body" | grep -q 'data-version="2026.08.12.6"'; then exit 0; fi
            sleep 5
          done
          echo 'Pages did not publish the expected version' >&2
          exit 1

      - name: Render deployed scales from live NOAA data
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p /tmp/renders/live
          node .verify-render.mjs 'https://dmo18.github.io/rdr/' /tmp/renders/live

      - name: Exercise full deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > .verify-full.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--hide-scrollbars']});
          try{
            const page=await browser.newPage();await page.setViewport({width:456,height:257,deviceScaleFactor:1});
            const browserErrors=[];page.on('pageerror',e=>browserErrors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error')browserErrors.push('console: '+m.text())});
            await page.goto(`https://dmo18.github.io/rdr/?view=florida&full=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__RDR__?.frames?.length>=3&&window.__RDR__?.surface?.get('florida')?.length>=1&&window.__RDR__?.severe?.lightning&&window.__RDR__?.severe?.mesh&&document.querySelector('#panel')?.dataset?.radar==='live',{timeout:240000,polling:500});
            await new Promise(r=>setTimeout(r,1600));
            const diag=await page.evaluate(()=>({version:document.querySelector('#panel').dataset.version,layout:document.querySelector('#panel').dataset.layout,frames:window.__RDR__.frames.length,surface:window.__RDR__.surface.get('florida')?.length||0,severe:{lightning:!!window.__RDR__.severe.lightning,mesh:!!window.__RDR__.severe.mesh},errors:window.__RDR__.errors,radar:document.querySelector('#panel').dataset.radar,browserSize:[innerWidth,innerHeight]}));
            if(diag.version!=='2026.08.12.6'||diag.layout!=='broadcast-fullbleed'||diag.radar!=='live'||diag.frames<3||diag.surface<1||!diag.severe.lightning||!diag.severe.mesh)throw new Error('full runtime failed: '+JSON.stringify(diag));
            if(diag.errors.some(e=>/ReferenceError|SyntaxError|invalid GRIB|unsupported PNG|unsupported GRIB/i.test(e)))throw new Error('runtime decoder error: '+JSON.stringify(diag));
            const panel=await page.$('#panel');await panel.screenshot({path:'/tmp/renders/live/full-runtime.png'});fs.writeFileSync('/tmp/renders/live/full-runtime.json',JSON.stringify({...diag,browserErrors},null,2));
          }finally{await browser.close()}
          JS
          node .verify-full.mjs

      - name: Visual sanity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for scope in ('local','live'):
              for v in ('home','metro','florida','regional'):
                  p=Path('/tmp/renders')/scope/f'{v}.png'
                  im=Image.open(p).convert('RGB')
                  assert im.size==(456,257), (scope,v,im.size)
                  px=list(im.getdata())
                  colors=len(set(px)); lit=sum(1 for r,g,b in px if max(r,g,b)>55); nonblack=sum(1 for r,g,b in px if r+g+b>25)
                  assert colors>300, (scope,v,'too few colors',colors)
                  assert lit>3000, (scope,v,'too dark',lit)
                  assert nonblack>35000, (scope,v,'too empty',nonblack)
          PY

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: rdr-broadcast-fullbleed-renders
          path: /tmp/renders
          retention-days: 7
