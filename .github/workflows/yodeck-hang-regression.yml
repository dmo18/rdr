name: Yodeck polling hang regression

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hang-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check runtime sources
        run: |
          set -euo pipefail
          node --check core.js
          node --check radar.js
          node --check qa/hang-regression.js
          node qa/cache-release-regression.mjs
          grep -q 'fetchWithTimeout' radar.js
          grep -q 'decompression fallback timeout' core.js
          grep -q 'unsupported asynchronous compression' core.js
      - name: Install browser QA
        run: npm install --no-save --package-lock=false puppeteer-core@25.9.0 >/dev/null
      - name: Serve regression page
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rdr-hang-http.log 2>&1 &
      - name: Wait for regression server
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/qa/hang-regression.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/rdr-hang-http.log >&2
          exit 1
      - name: Reproduce bounded Yodeck failure paths at 456 x 257
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-gpu']});
          try{
            const page=await browser.newPage();await page.setViewport({width:456,height:257,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/qa/hang-regression.html',{waitUntil:'load'});
            await page.waitForFunction(()=>window.__QA__?.ready===true,{timeout:5000});
            const qa=await page.evaluate(()=>window.__QA__);if(qa.viewport[0]!==456||qa.viewport[1]!==257||qa.poll.locked||qa.poll.backfillLocked||qa.poll.listings!==2||qa.poll.gribBodies!==3||qa.poll.radar!=='unavailable'||qa.poll.freshness!=='stale'||!qa.fallback.retried||errors.length)throw new Error(JSON.stringify({qa,errors}));
            console.log(JSON.stringify(qa));
          }finally{await browser.close()}
          JS
