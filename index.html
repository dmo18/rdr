<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDR Radar Ops Panel</title>
  <meta name="description" content="Radar-first Yodeck panel for South Florida.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="shell">
    <section id="panel" aria-label="South Florida radar panel">
      <div id="stage"></div>
      <div id="boot" class="boot hidden">Loading radar views…</div>
      <div id="statusbar" class="statusbar">
        <span id="statusView">RADAR</span>
        <span class="dot"></span>
        <span id="statusProduct">KAMX</span>
        <span class="dot"></span>
        <span id="statusDetail">LIVE</span>
        <span class="spacer"></span>
        <span id="statusTime">--:--:--</span>
      </div>
    </section>
  </main>

  <template id="view-template">
    <section class="view">
      <div class="media-wrap">
        <img class="media" alt="">
        <div class="scrim"></div>
        <div class="labelchip hidden"></div>
        <div class="reticle hidden" aria-hidden="true">
          <div class="ring"></div>
          <div class="crosshair h"></div>
          <div class="crosshair v"></div>
          <div class="core"></div>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
