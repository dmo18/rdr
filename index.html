<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02070c">
  <meta name="color-scheme" content="dark">
  <title>RDR South Florida Weather HUD</title>
  <meta name="description" content="Automatic 456 by 257 South Florida weather HUD for Yodeck.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="shell">
    <section id="panel" data-version="2026.08.11.7" data-ready="false" data-view="home" data-home-rain="loading" data-weather="loading" aria-label="South Florida weather HUD">
      <div id="views" aria-live="off"></div>

      <div class="home-pin" aria-label="Home location"><i></i><b></b></div>

      <header class="hud-top">
        <div class="view-id">
          <span>RDR</span>
          <strong id="viewName">HOME</strong>
        </div>
        <div class="home-status">
          <span class="live-dot" aria-hidden="true"></span>
          <strong id="homeState">...</strong>
          <span id="nearestRain"></span>
        </div>
        <div class="now-weather">
          <strong id="nowTemp">--°</strong>
          <span id="nowWx">LOADING</span>
        </div>
      </header>

      <div id="forecast" class="forecast-strip" aria-label="Next four hours"></div>
      <div id="sourceBadge" class="source-badge"></div>

      <footer id="telemetry" class="telemetry">
        <strong id="weatherLine">CLOUD -- · TSTM --</strong>
        <span class="spacer"></span>
        <span id="alertLine">NO ALERTS</span>
        <span class="sep">·</span>
        <span id="loopRange">LOOP</span>
        <span class="sep">·</span>
        <time id="radarTime">--:--</time>
      </footer>

      <div id="boot" class="boot"><b>RDR</b><span>ACQUIRING WEATHER</span></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
