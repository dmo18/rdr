<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02070c">
  <meta name="color-scheme" content="dark">
  <title>RDR South Florida Radar</title>
  <meta name="description" content="Multi-scale South Florida radar instrument for Yodeck.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="shell">
    <section id="panel" data-version="2026.08.11.6" data-ready="false" data-view="home" data-home-rain="loading" aria-label="South Florida radar">
      <div id="views" aria-live="off"></div>

      <div class="home-pin" aria-label="Home location"><i></i><b></b></div>

      <footer id="telemetry" class="telemetry">
        <span class="live-dot" aria-hidden="true"></span>
        <strong id="viewName">HOME</strong>
        <span class="sep">·</span>
        <strong id="homeState">...</strong>
        <span id="nearestRain" class="nearest"></span>
        <span class="spacer"></span>
        <span id="loopRange">LOOP</span>
        <span class="sep">·</span>
        <time id="radarTime">--:--</time>
      </footer>

      <div id="boot" class="boot"><b>RADAR</b><span>ACQUIRING</span></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
