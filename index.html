<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020509">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="456 x 257 South Florida NEXRAD radar panel for Yodeck.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://radar.weather.gov data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>RDR South Florida Radar</title>
  <link rel="stylesheet" href="radar.css">
</head>
<body>
  <main id="radarApp" aria-label="South Florida radar">
    <div class="radar-stage">
      <img id="radarImage" class="radar-image" alt="Animated Miami KAMX NEXRAD base reflectivity radar" referrerpolicy="no-referrer">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="edge-vignette" aria-hidden="true"></div>

      <div class="target" aria-label="Configured location 26.061979, -80.187871">
        <span class="target-ring"></span>
        <span class="target-dot"></span>
      </div>

      <div id="sourceFailure" class="source-failure hidden">
        <strong>RADAR FEED UNAVAILABLE</strong>
        <span>RETRYING NOAA KAMX</span>
      </div>

      <div class="telemetry">
        <span id="liveState" class="live-state"><i></i>LIVE</span>
        <span class="divider"></span>
        <span>KAMX</span>
        <span class="divider"></span>
        <span>0.5° REF</span>
        <span class="telemetry-spacer"></span>
        <span id="scanTime">--:--:--</span>
      </div>
    </div>
  </main>
  <script src="radar.js"></script>
</body>
</html>
